[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinder"
version = "0.1.0"
description = "An annealing-tablet environment: read an invented tally from a picture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
openenv = [
    "openenv>=0.2.2",
    "fastapi>=0.116",
    "uvicorn>=0.24",
]
train = [
    "torch>=2.1",
]
dev = [
    "pytest>=8",
]

[project.scripts]
cinder-play = "cinder.play:main"

[tool.setuptools.packages.find]
include = ["cinder*"]

[tool.setuptools.package-data]
cinder = ["static/*", "weights/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
